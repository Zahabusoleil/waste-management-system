<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" aria-label="EcoTrack logo">
  <defs>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7fff9a"/>
      <stop offset="40%" stop-color="#25d882"/>
      <stop offset="100%" stop-color="#0a9e55"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#25d882" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#25d882" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a9d8e"/>
      <stop offset="40%" stop-color="#c4d4c6"/>
      <stop offset="100%" stop-color="#5a7060"/>
    </linearGradient>
    <linearGradient id="metal2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6b8070"/>
      <stop offset="50%" stop-color="#b0c8b4"/>
      <stop offset="100%" stop-color="#4a6050"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outer metallic leaf / teardrop shell -->
  <path d="M60 8 C30 8, 10 32, 10 62 C10 86, 28 108, 60 112 C92 108, 110 86, 110 62 C110 32, 90 8, 60 8 Z"
        fill="url(#metal1)" filter="url(#shadow)" opacity="0.9"/>

  <!-- Inner swirl arc 1 -->
  <path d="M38 30 C20 45, 20 80, 55 90 C70 95, 90 85, 92 68 C94 50, 78 35, 60 32"
        stroke="url(#metal2)" stroke-width="6" fill="none" stroke-linecap="round" filter="url(#shadow)"/>

  <!-- Inner swirl arc 2 -->
  <path d="M82 32 C98 50, 94 82, 68 94 C50 100, 30 90, 26 72 C22 55, 36 38, 52 34"
        stroke="url(#metal1)" stroke-width="5" fill="none" stroke-linecap="round" filter="url(#shadow)" opacity="0.75"/>

  <!-- Glow halo behind orb -->
  <circle cx="60" cy="58" r="20" fill="url(#glow)"/>

  <!-- Central glowing orb -->
  <circle cx="60" cy="58" r="11" fill="url(#orb)" filter="url(#glowFilter)"/>
  <circle cx="56" cy="54" r="3.5" fill="white" opacity="0.5"/>
</svg>
