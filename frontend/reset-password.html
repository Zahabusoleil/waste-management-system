<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Reset Password | EcoTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"/>
</head>
<body style="min-height:100vh;display:flex;flex-direction:column;background:var(--bg);">
  <header class="site-header">
    <div class="container navbar">
      <a href="/" class="brand"><span class="brand-logo"><img src="images/logo.svg" alt="EcoTrack" width="34" height="34"/></span>EcoTrack</a>
    </div>
  </header>
  <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:3rem 1.5rem;">
    <div style="width:100%;max-width:440px;">
      <div style="text-align:center;margin-bottom:2rem;">
        <img src="images/logo.svg" alt="EcoTrack" width="64" height="64" style="margin:0 auto 1rem;"/>
        <h1 style="font-size:1.7rem;font-weight:800;margin-bottom:.3rem;">Set new password</h1>
        <p style="font-size:.875rem;color:var(--muted);">Enter and confirm your new password below</p>
      </div>
      <div class="panel">
        <div id="resetMessage" class="alert" hidden></div>
        <div id="resetFormWrap">
          <form id="resetTokenForm" novalidate>
            <input type="hidden" id="resetToken" name="token"/>
            <div class="form-group">
              <label for="newPass">New password</label>
              <div class="password-wrap">
                <input id="newPass" name="newPassword" type="password" placeholder="Minimum 8 characters" required minlength="8"/>
                <button type="button" class="toggle-pass" data-target="newPass"><svg class="icon icon-md" aria-hidden="true" focusable="false"><use href="/images/icons.svg#icon-eye"></use></svg></button>
              </div>
            </div>
            <div class="form-group">
              <label for="confirmPass">Confirm new password</label>
              <div class="password-wrap">
                <input id="confirmPass" name="confirmPassword" type="password" placeholder="Repeat your new password" required minlength="8"/>
                <button type="button" class="toggle-pass" data-target="confirmPass"><svg class="icon icon-md" aria-hidden="true" focusable="false"><use href="/images/icons.svg#icon-eye"></use></svg></button>
              </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Reset Password</button>
          </form>
        </div>
        <p style="text-align:center;margin-top:1.25rem;font-size:.85rem;color:var(--muted);">
          <a href="login.html" class="auth-link">&larr; Back to Sign In</a>
        </p>
      </div>
    </div>
  </div>
<script src="js/main.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
  var params = new URLSearchParams(window.location.search);
  var token  = params.get("token");
  var msgEl  = document.getElementById("resetMessage");
  var wrap   = document.getElementById("resetFormWrap");
  document.querySelectorAll(".toggle-pass").forEach(function(btn) {
    btn.addEventListener("click", function() {
      var inp = document.getElementById(btn.dataset.target);
      if (inp) inp.type = inp.type === "password" ? "text" : "password";
    });
  });
  if (!token) {
    wrap.style.display = "none";
    msgEl.className = "alert alert-error";
    msgEl.textContent = "Invalid or missing reset token. Please request a new password reset.";
    msgEl.hidden = false;
    return;
  }
  document.getElementById("resetToken").value = token;
  document.getElementById("resetTokenForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    var newPassword = document.getElementById("newPass").value;
    var confirmPassword = document.getElementById("confirmPass").value;
    if (newPassword !== confirmPassword) {
      msgEl.className = "alert alert-error"; msgEl.textContent = "Passwords do not match."; msgEl.hidden = false; return;
    }
    try {
      var res = await apiFetch("/auth/reset-password-token", { method: "POST", body: JSON.stringify({ token, newPassword, confirmPassword }) });
      wrap.style.display = "none";
      msgEl.className = "alert alert-success";
      msgEl.textContent = res.message + " Redirecting to sign in…";
      msgEl.hidden = false;
      setTimeout(function() { window.location.href = "/login.html"; }, 2500);
    } catch(err) {
      msgEl.className = "alert alert-error"; msgEl.textContent = err.message; msgEl.hidden = false;
    }
  });
});
</script>
</body>
</html>
